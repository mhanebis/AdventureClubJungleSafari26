<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Club — Safari Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Reset & Dynamic Full-Bleed Imagery Backdrop */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Pulls a beautiful, premium cartoon jungle landscape instantly from a safe web link */
            background: linear-gradient(rgba(12, 43, 24, 0.15), rgba(12, 43, 24, 0.35)), 
                        url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #2b2b2b;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 15px;
        }

        /* Primary Safari Card Container with Signature Spring Animation */
        .safari-card {
            background: #fffcf4; /* Warm Parchment */
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            border: 6px solid #e2a826; /* Golden Accent Ring */
            width: 100%;
            max-width: 440px;
            padding: 25px 20px 20px 20px;
            text-align: center;
            position: relative;
            z-index: 25;
            animation: springEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes springEntrance {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Headers and Badges */
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.1rem;
            color: #0c2b18;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .role-badge {
            display: inline-block;
            background-color: #0070d2;
            color: white;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Gold Medallion Frame */
        .medallion-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 5px auto 15px auto;
        }

        .gold-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 7px solid #e2a826;
            background: #114223;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.3);
        }

        .character-gif {
            width: 102%;
            height: 102%;
            object-fit: cover;
        }

        .floating-emoji {
            position: absolute;
            bottom: -5px;
            right: -5px;
            font-size: 3.2rem;
            animation: floatLoop 3s ease-in-out infinite;
        }

        @keyframes floatLoop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Fact Panels */
        .fact-panel {
            background-color: #fcf6e8;
            border: 2px solid #ecdcb9;
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 10px;
            text-align: left;
        }

        .fact-panel.wildlife { border-left: 6px solid #e27d60; }
        .fact-panel.science { border-left: 6px solid #e2a826; margin-bottom: 15px; }
        .fact-label { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 3px; }
        .wildlife .fact-label { color: #e27d60; }
        .science .fact-label { color: #b7810e; }
        .fact-text { font-size: 1rem; line-height: 1.4; color: #3e3e3c; }

        /* Tactile Audio Button & Sound Waves */
        .audio-btn {
            background-color: #114223;
            color: #fffcf4;
            border: none;
            border-radius: 50px;
            padding: 16px 24px;
            font-size: 1.25rem;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 0 #072010, 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .audio-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #072010, 0 4px 8px rgba(0,0,0,0.2);
        }

        .sound-waves { display: none; align-items: center; gap: 3px; height: 18px; }
        .audio-btn.playing .sound-waves { display: inline-flex; }
        .
